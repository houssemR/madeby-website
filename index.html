<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ===== PRIMARY SEO ===== -->
    <title>Craft MadeBy — App for Handmade Creators & Artisans</title>
    <meta name="description" content="Craft MadeBy is the app for handmade creators. Document your projects step-by-step with real recorded time, pick your craft theme and meet your mascot with daily craft questions and weekly tips, host wrapped giveaways, and certify your work through the Expert Panel." />
    <meta name="keywords" content="craftmadeby, craftmadeby app, handmade app, craft app, crafter community, artisan app, handcraft projects, DIY tracker, pottery app, knitting community, sewing app, embroidery community, craft social network, handmade giveaway, crafter portfolio" />
    <meta name="author" content="Craft MadeBy" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="https://craftmadeby.com/" />

    <!-- Pinterest domain ownership. Claiming the domain attributes every Pin
         that links back to craftmadeby.com to the Craft MadeBy account and
         unlocks analytics for Pins other people create from the site. -->
    <meta name="p:domain_verify" content="2168ca6357ce9d696cc42c2314c6c862" />

    <!-- ===== FAVICON ===== -->
    <!-- Search engines want a square icon sized in multiples of 48, and Bing
         still looks for /favicon.ico at the root. The 512px launcher icon
         satisfied neither, so results showed the wrong mark or none at all.
         Regenerate with: node tools/make-favicons.mjs -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />

    <!-- ===== OPEN GRAPH (Facebook, WhatsApp, LinkedIn previews) ===== -->

    <meta property="og:url" content="https://craftmadeby.com/" />
    <meta property="og:site_name" content="Craft MadeBy" />
    <meta property="og:title" content="Craft MadeBy — App for Handmade Creators & Artisans" />
    <meta property="og:description" content="Document your handmade projects with recorded time, craft joint projects, host wrapped giveaways, and earn your Expert Panel seat on Craft MadeBy." />
    <meta property="og:image" content="https://craftmadeby.com/images/screens/home.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Craft MadeBy — Handmade creator community app" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:image" content="https://craftmadeby.com/images/screens/home.png" />
