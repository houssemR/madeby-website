<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Craft MadeBy">
  <!-- The brand mark, identical to the launcher icon: the porcelain monogram
       on the sage tile. Colours and inset come from the app's own brand set
       (AppColors.sageFill #78907A, glyph #FFF8F5 — see BrandLogo and
       tool/webtest/make_logo_variant.js). Full-bleed, so placements render it
       directly instead of tinting a stroke inside a coloured wrapper. -->
  <rect width="200" height="200" rx="44" fill="#78907A"/>
  <g transform="translate(100 100) scale(1.7714) translate(-100 -100)">
    <path d="M70 115 V85 Q70 70 85 70 T100 85 V115 Q100 130 115 130 T130 115 Q130 100 115 100"
          fill="none"
          stroke="#FFF8F5"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
</svg>
