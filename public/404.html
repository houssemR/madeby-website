<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft MadeBy</title>
  <meta name="robots" content="noindex">
  <!-- Link-preview tags for scrapers that land here (they don't run the
       script below): a generic branded card. Per-maker previews need the
       page served with a 200 from a host that can proxy /m/* (e.g. a
       Cloudflare Worker in front of GitHub Pages). -->
  <meta property="og:site_name" content="Craft MadeBy">
  <meta property="og:type" content="website">
  <meta property="og:title" content="A maker on Craft MadeBy">
  <meta property="og:description" content="See their handmade pieces and connect with them in the app. Handmade · Documented · Celebrated.">
  <meta property="og:image" content="https://craftmadeby.com/images/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A maker on Craft MadeBy">
  <meta name="twitter:description" content="See their handmade pieces and connect with them in the app.">
  <meta name="twitter:image" content="https://craftmadeby.com/images/og-card.jpg">
  <!--
    GitHub Pages fallback for maker profile links (craftmadeby.com/m/<CODE>).

    The real page is server-rendered by the Supabase edge function
    `profile-card` (it carries the Open Graph tags that give the link a rich
    preview). On a host that can proxy (Netlify: see netlify.toml) /m/* is
    served from there directly. On GitHub Pages nothing dynamic can run, so
    this 404 page fetches that HTML and shows it in place — visitors still
    see the card, QR and "Open in app"; only the social preview stays generic.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet"><style>
    body{margin:0;background:#CFDCC8;color:#1E1B19;font-family:'Hanken Grotesk',system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
    a{color:#1F3326;font-weight:600;text-underline-offset:3px}
    .fallback{display:grid;justify-items:center;gap:14px}
    .fallback img{width:56px;height:56px;border-radius:22%}
    .fallback h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:clamp(1.9rem,5vw,2.6rem);line-height:1.05;letter-spacing:-.015em;color:#1F3326;margin:0}
    .fallback p{margin:0;color:#4A4A40}
  </style>
</head>
<body>
  <div id="msg">Loading…</div>
  <script>
    (function () {
      // /m/<invite code> = maker profile, /p/<share code> = a piece.
      var m = location.pathname.match(/^\/(m|p)\/([A-Za-z0-9-]{3,32})\/?$/);
      var msg = document.getElementById('msg');
      function card(title, note) {
        return '<div class="fallback"><img src="/logo.svg" alt="">' +
               '<h1>' + title + '</h1><p>' + note + '</p>' +
               '<p><a href="/">Back to craftmadeby.com</a></p></div>';
      }
      if (!m) {
        msg.innerHTML = card('Page not found', 'That address does not exist here.');
        return;
      }
      var kind = m[1], code = m[2].toUpperCase();
      var src = 'https://yudqqdnpyguyekqcjvhr.supabase.co/functions/v1/profile-card/' + (kind === 'p' ? 'p/' : '') + encodeURIComponent(code);
      fetch(src).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(function (html) {
        document.open();
        document.write(html);
        document.close();
        history.replaceState(null, '', '/' + kind + '/' + code);
      }).catch(function () {
        msg.innerHTML = card('This invite link is no longer valid', 'Ask the crafter for a fresh one.');
      });
    })();
  </script>
</body>
</html>
