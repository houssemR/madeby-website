<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Craft MadeBy</title>
  <meta name="robots" content="noindex">
  <!-- Link-preview tags for scrapers that land here (they don't run the
       script below): a generic branded card. Per-maker previews need the
       page served with a 200 from a host that can proxy /m/* (e.g. a
       Cloudflare Worker in front of GitHub Pages). -->
  <meta property="og:site_name" content="Craft MadeBy">
  <meta property="og:type" content="website">
  <meta property="og:title" content="A maker on Craft MadeBy">
  <meta property="og:description" content="See their handmade pieces and connect with them in the app. Handmade · Documented · Celebrated.">
  <meta property="og:image" content="https://craftmadeby.com/images/screens/home.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="A maker on Craft MadeBy">
  <meta name="twitter:description" content="See their handmade pieces and connect with them in the app.">
  <meta name="twitter:image" content="https://craftmadeby.com/images/screens/home.png">
  <!--
    GitHub Pages fallback for maker profile links (craftmadeby.com/m/<CODE>).

    The real page is server-rendered by the Supabase edge function
    `profile-card` (it carries the Open Graph tags that give the link a rich
    preview). On a host that can proxy (Netlify: see netlify.toml) /m/* is
    served from there directly. On GitHub Pages nothing dynamic can run, so
    this 404 page fetches that HTML and shows it in place — visitors still
    see the card, QR and "Open in app"; only the social preview stays generic.
  -->
  <style>
    body{margin:0;background:#FFF8F5;color:#1E1B19;font-family:system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}
    a{color:#2F4A3C}
  </style>
</head>
<body>
  <div id="msg">Loading…</div>
  <script>
    (function () {
      // /m/<invite code> = maker profile, /p/<share code> = a piece.
      var m = location.pathname.match(/^\/(m|p)\/([A-Za-z0-9-]{3,32})\/?$/);
      var msg = document.getElementById('msg');
      if (!m) {
        msg.innerHTML = '<h1>Page not found</h1><p><a href="/">Back to craftmadeby.com</a></p>';
        return;
      }
      var kind = m[1], code = m[2].toUpperCase();
      var src = 'https://yudqqdnpyguyekqcjvhr.supabase.co/functions/v1/profile-card/' + (kind === 'p' ? 'p/' : '') + encodeURIComponent(code);
      fetch(src).then(function (r) {
        if (!r.ok) throw new Error(r.status);
        return r.text();
      }).then(function (html) {
        document.open();
        document.write(html);
        document.close();
        history.replaceState(null, '', '/' + kind + '/' + code);
      }).catch(function () {
        msg.innerHTML = '<h1>This invite link is no longer valid</h1><p><a href="/">Back to craftmadeby.com</a></p>';
      });
    })();
  </script>
</body>
</html>
